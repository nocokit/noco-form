<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noco-Form</title>
    <script>
      // GitHub Pages SPA 路径恢复
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        // 处理 404.html 传来的 query string 路径
        var search = window.location.search;
        if (search) {
          var p = search.slice(1).split('&').reduce(function(acc, s) {
            var r = s.split('=');
            acc[decodeURIComponent(r[0])] = r.slice(1).join('=').replace(/~and~/g, '&');
            return acc;
          }, {});
          if (p.p !== undefined) {
            window.history.replaceState(
              null, null,
              window.location.pathname.slice(0, -1) + (p.p || '/') +
              (p.q ? '?' + p.q : '') + (window.location.hash || '')
            );
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#f5f5f5;">
        <div style="width:200px;height:6px;background:#e0e0e0;border-radius:4px;overflow:hidden;">
          <div style="width:40%;height:100%;background:#1677ff;border-radius:4px;animation:sk 1.2s ease-in-out infinite;"></div>
        </div>
      </div>
    </div>
    <style>@keyframes sk{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}</style>
    <script type="module" src="/src/main.ts"></script>

</html>
