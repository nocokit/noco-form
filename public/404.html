<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>柠檬轻表单</title>
    <script>
      // GitHub Pages SPA 重定向方案
      // 将路径转为 query string，由 index.html 恢复
      var pathSegmentsToKeep = 1; // /noco-form/ 占一段
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
</html>
